{% extends 'base.html' %}

{% block content %}
<h2>Reply</h2>

{% if error %}
<p class="error">{{ error }}</p>
{% endif %}

<div class="message">
    <img class="avatar" src="{{ parent_message.image_url }}" alt="{{ parent_message.username }} avatar">
    <p class="message-text">{{ parent_message.text }}</p>
    <p class="message-info">Created at: {{ parent_message.timestamp }}</p>
    <p class="message-info">Username: {{ parent_message.username }}</p>
</div>

<form>
    <input type="hidden" name="id" value="{{ parent_id }}">
    <p>
        <textarea name="message" rows="5" cols="60"></textarea>
    </p>
    <p>
        <input type="submit" value="Reply">
    </p>
</form>
{% endblock %}
